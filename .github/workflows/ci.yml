name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.xml"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/results.xml'

  build-admin:
    name: Build Admin Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Admin Docker image
        run: docker build -f src/Firmeza.Admin/Dockerfile -t firmeza-admin .

  build-api:
    name: Build API Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -f src/Firmeza.API/Dockerfile -t firmeza-api .

  build-client:
    name: Build Client Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Client Docker image
        run: |
          docker build \
            -f src/Firmeza.Client/Dockerfile \
            --build-arg VITE_API_URL=http://localhost/api \
            -t firmeza-client \
            src/Firmeza.Client